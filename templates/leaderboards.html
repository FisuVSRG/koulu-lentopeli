<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboards - Flight Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/api/leaderboards')
                .then(response => response.json())
                .then(data => {
                    let tableBody = document.querySelector('#scoresTable tbody');
                    tableBody.innerHTML = '';
                    data.forEach(score => {
                        let row = document.createElement('tr');
                        let usernameCell = document.createElement('td');
                        usernameCell.textContent = score.username;
                        let scoreCell = document.createElement('td');
                        scoreCell.textContent = score.score;
                        row.appendChild(usernameCell);
                        row.appendChild(scoreCell);
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => console.error('Error fetching data:', error));
        });
    </script>
</head>
<body>
    <div class="menu-container">
        <h1 class="title">LEADERBOARDS</h1>
        <p>Here are the top scores in the game!</p>
        <div class="leaderboard">
            <table id="scoresTable">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- JavaScript will dynamically populate this section -->
                </tbody>
            </table>
        </div>
        <a href="{{ url_for('index') }}" class="menu-button">Back to Menu</a>
    </div>
</body>
</html>
