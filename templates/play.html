<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peli</title>
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body class="play-page" onload="playGame()">
    <div class="map-container">
        <div id="map-left" class="map"></div>
        <div id="map-right" class="map"></div>
    </div>
    <div class="text-box">
        Choose the airport that you think has the higher elevation.
    </div>

    <div class="divider"></div>

    <div class="option-buttons">
        <button id="btn1" onclick="playRound('correct')" class="menu-button left"></button>
        <button id="btn2" onclick="playRound('wrong')" class="menu-button right"></button>
    </div>

    <div class="info-boxes">
        <div id="info-left" class="info-box">Country info for Option 1 will appear here.</div>
        <div id="info-right" class="info-box">Country info for Option 2 will appear here.</div>
    </div>

    <!-- Leaflet.js library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<p id="currentScore"></p>
</body>
</html>
