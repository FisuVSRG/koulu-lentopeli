<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peli</title>
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
</head>
<body class="play-page">
    <div class="map-container">
        <div id="map-left" class="map"></div>
        <div id="map-right" class="map"></div>
    </div>

    <div class="text-box">
        Choose the airport that you think has the higher elevation.
    </div>

    <div class="divider"></div>

    <div class="option-buttons">
        <button class="menu-button left">Option 1</button>
        <button class="menu-button right">Option 2</button>
    </div>

    <div class="info-boxes">
        <div id="info-left" class="info-box">Country info for Option 1 will appear here.</div>
        <div id="info-right" class="info-box">Country info for Option 2 will appear here.</div>
    </div>

    <!-- Inject Flask-passed coordinates and country codes -->
    <script>
        const coordinates1 = JSON.parse('{{ coordinates1 | tojson | safe }}');
        const coordinates2 = JSON.parse('{{ coordinates2 | tojson | safe }}');
        const countryCode1 = "{{ country1 }}";
        const countryCode2 = "{{ country2 }}";
    </script>

    <!-- Fetch country info and display it -->
    <script>
        function fetchCountryInfo(countryCode, infoBoxContentId) {
            const url = `https://restcountries.com/v3.1/name/${countryCode}`;

            fetch(url).then(response => response.json()).then(data => {
                if (data.length > 0) {
                    const countryData = data[0];
                    const infoBoxContent = document.getElementById(infoBoxContentId);
                    infoBoxContent.textContent = formatCountryInfo(countryData);
                } else {
                    console.error(`No country found for code: ${countryCode}`);
                }
            }).catch(error => console.error(error));
        }

        function formatCountryInfo(countryData) {
            return `
            Country: ${countryData.name.common}
            Capital: ${countryData.capital[0]}
            Population: ${countryData.population.toLocaleString()}
            `;
        }

        fetchCountryInfo(countryCode1, 'info-left');
        fetchCountryInfo(countryCode2, 'info-right');
    </script>

    <!-- Leaflet.js library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Initialize maps with dynamic coordinates -->
    <script>
        function createLeafletMap(elementId, coordinates, zoomLevel = 5) { // Default zoom level to 13

     // Avoid modifying the original coordinates array
      const adjustedCoordinates = [coordinates[0] - 6, coordinates[1]]; // Add offset to create a new array

      const mapOptions = {
        center: adjustedCoordinates,
        zoom: zoomLevel
      };

      // Create the map instance
      const map = L.map(elementId, mapOptions);

      // Add the tile layer with attribution
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      // Add a marker at the provided coordinates
      L.marker(coordinates).addTo(map);
    }

    // Ensure the maps are created after the DOM is fully loaded
    document.addEventListener("DOMContentLoaded", function () {
      createLeafletMap('map-left', coordinates1);
      createLeafletMap('map-right', coordinates2);
    });
    </script>
</body>
</html>
